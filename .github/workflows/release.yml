name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used for the IPA filename (manual runs only)
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  APP_NAME: Kumone
  SPARKLE_VERSION: "2.9.5"
  SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Derive version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          Scripts/release-notes.sh "$VERSION" --html > "$RUNNER_TEMP/$APP_NAME-$VERSION.html"

          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/notes.md"
          VERSION="${VERSION}-carplay"

      # ----------------------------------------------------------------------
      # iOS / TrollStore / CarPlay
      # ----------------------------------------------------------------------

      - name: Configure iOS CarPlay
        run: |
          set -euo pipefail

          echo "=== Configure CarPlay ==="

          make configure-carplay

          echo
          echo "=== Generated files ==="
          find ios/Config/Generated \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "=== CarPlay xcconfig ==="
          cat ios/Config/CarPlay.local.xcconfig

          echo
          echo "=== CarPlay entitlements ==="
          cat ios/Config/Generated/KumoneIOS-CarPlay.entitlements

          echo
          echo "=== Verify CarPlay entitlement ==="

          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.developer.carplay-audio" \
            ios/Config/Generated/KumoneIOS-CarPlay.entitlements

          echo
          echo "=== Verify CarPlay Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UISupportsCarPlay" \
            ios/Config/Generated/Info-CarPlay.plist

      - name: Install ldid
        run: |
          set -euo pipefail

          brew install ldid-procursus

          echo "=== ldid version ==="
          command -v ldid
          ldid 2>&1 | head -20

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          echo "=== Building iOS app with CarPlay enabled ==="

          xcodebuild \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"

          test -d "$APP"
          test -f "$APP/KumoneIOS"

          echo
          echo "=== Built app ==="
          ls -lah "$APP"

          echo
          echo "=== Executable ==="
          file "$APP/KumoneIOS"

      - name: Prepare TrollStore entitlements
        run: |
          set -euo pipefail

          SOURCE_ENTITLEMENTS="ios/Config/Generated/KumoneIOS-CarPlay.entitlements"
          TROLLSTORE_ENTITLEMENTS="$RUNNER_TEMP/KumoneIOS-TrollStore.entitlements"

          test -f "$SOURCE_ENTITLEMENTS"

          cp \
            "$SOURCE_ENTITLEMENTS" \
            "$TROLLSTORE_ENTITLEMENTS"

          echo "=== Entitlements before modification ==="
          cat "$TROLLSTORE_ENTITLEMENTS"

          echo
          echo "=== Verify CarPlay entitlement ==="

          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.developer.carplay-audio" \
            "$TROLLSTORE_ENTITLEMENTS"

          echo
          echo "=== Final TrollStore entitlement file ==="

          cat "$TROLLSTORE_ENTITLEMENTS"

      - name: Sign iOS app with ldid
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          ENTITLEMENTS="$RUNNER_TEMP/KumoneIOS-TrollStore.entitlements"

          echo "=== Mach-O before signing ==="
          file "$APP/KumoneIOS"

          echo
          echo "=== Signing nested Mach-O files ==="

          find "$APP" -type f -print0 |
            while IFS= read -r -d '' FILE; do
              if file "$FILE" | grep -q 'Mach-O'; then
                echo "Signing: $FILE"
                ldid -s "$FILE"
              fi
            done

          echo
          echo "=== Signing main executable with CarPlay entitlement ==="

          ldid -S"$ENTITLEMENTS" "$APP/KumoneIOS"

          echo
          echo "=== Deep signing app bundle ==="

          # -s keeps the entitlements already present on each Mach-O.
          # ldid supports recursive signing of .app bundles with -s.
          ldid -s "$APP"

          echo
          echo "=== Main executable entitlements ==="
          ldid -e "$APP/KumoneIOS"

          echo
          echo "=== Verify CarPlay entitlement ==="

          ldid -e "$APP/KumoneIOS" > "$RUNNER_TEMP/final-entitlements.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.developer.carplay-audio" \
            "$RUNNER_TEMP/final-entitlements.plist"

          echo
          echo "=== Verify CarPlay Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UISupportsCarPlay" \
            "$APP/Info.plist"
      - name: Verify CarPlay entitlement
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          MAIN_EXEC="$APP/KumoneIOS"

          echo "=== Verify Mach-O signature ==="

          ldid -e "$MAIN_EXEC" > "$RUNNER_TEMP/final-entitlements.plist"

          cat "$RUNNER_TEMP/final-entitlements.plist"

          echo
          echo "=== Verify CarPlay entitlement ==="

          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.developer.carplay-audio" \
            "$RUNNER_TEMP/final-entitlements.plist"

          echo
          echo "=== Verify bundle identifier ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo
          echo "=== Verify version ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

          echo
          echo "=== Verify CarPlay Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UISupportsCarPlay" \
            "$APP/Info.plist"

          echo
          echo "========================================"
          echo "CarPlay entitlement verification PASSED"
          echo "========================================"

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          PAYLOAD="$RUNNER_TEMP/trollstore-payload"
          IPA="$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION-TrollStore-CarPlay.ipa"

          test -d "$APP"

          rm -rf "$PAYLOAD"

          mkdir -p "$PAYLOAD/Payload"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp -R \
            "$APP" \
            "$PAYLOAD/Payload/Kumone.app"

          cd "$PAYLOAD"

          zip -qry \
            "$IPA" \
            Payload

          echo
          echo "=== IPA created ==="
          ls -lh "$IPA"

          echo
          echo "=== IPA contents ==="
          unzip -l "$IPA" | head -50

      - name: Validate packaged IPA
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION-TrollStore-CarPlay.ipa"
          CHECK="$RUNNER_TEMP/ipa-check"

          test -f "$IPA"

          rm -rf "$CHECK"
          mkdir -p "$CHECK"

          unzip -q "$IPA" -d "$CHECK"

          APP="$CHECK/Payload/Kumone.app"
          MAIN_EXEC="$APP/Kumone"

          test -d "$APP"
          test -f "$MAIN_EXEC"

          echo "=== IPA executable ==="
          file "$MAIN_EXEC"

          echo
          echo "=== IPA entitlements ==="

          ldid -e "$MAIN_EXEC" \
            > "$RUNNER_TEMP/ipa-entitlements.plist"

          cat "$RUNNER_TEMP/ipa-entitlements.plist"

          echo
          echo "=== IPA CarPlay entitlement ==="

          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.developer.carplay-audio" \
            "$RUNNER_TEMP/ipa-entitlements.plist"

          echo
          echo "=== IPA Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Print :UISupportsCarPlay" \
            "$APP/Info.plist"

          echo
          echo "========================================"
          echo "TrollStore CarPlay IPA validation PASSED"
          echo "========================================"

      # ----------------------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            --title "$APP_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/$APP_NAME-iOS-$VERSION-TrollStore-CarPlay.ipa" \
            dist/appcast.xml

